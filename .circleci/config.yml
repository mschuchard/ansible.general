---
version: 2.1

jobs:
  test:
    working_directory: /tmp/project/ansible_collections/mschuchard/general
    docker:
    - image: matthewschuchard/ansible-module
    resource_class: small
    steps:
    - checkout
    - run:
        name: ruff
        command: ruff check .
    - run:
        name: ty
        command: ty check plugins
    - run:
        name: pytest module utils
        command: pytest tests/unit/plugins/module_utils
    - run:
        name: ansible acceptance tests
        command: /bin/sh tests/acceptance/test.sh
    - run:
        name: ansible documentation validation
        command: ansible-doc --type module --json $(find plugins/modules -maxdepth 1 -name '*.py' -printf 'mschuchard.general.%f\n' | sed 's/\.py$//') > /dev/null

workflows:
  execute_tests:
    jobs:
    - test
